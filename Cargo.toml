[package]
name = "app-switch-claude"
version = "0.1.1"
edition = "2024"
description = "Chuyển nhanh giữa các tài khoản Claude trên ứng dụng Claude Desktop (macOS và Windows)"

[lib]
name = "app_switch_claude"
path = "src/lib.rs"

[[bin]]
name = "app-switch-claude"
path = "src/main.rs"
required-features = ["gui"]

[[test]]
name = "ui"
path = "tests/ui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
# The window. Without it only the account-switching logic is built, which is all the
# diagnostic program needs (examples/probe.rs): `--no-default-features` keeps the whole
# window toolkit out of it.
gui = ["dep:chrono", "dep:eframe"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
dirs = "7"
eframe = { version = "0.37", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
tempfile = "3"

[profile.release]
strip = true
